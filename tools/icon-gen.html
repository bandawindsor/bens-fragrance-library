<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Icon generator</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300..700&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:24px;background:#F3F3F1;font-family:Jost,sans-serif;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;}
  figure{margin:0;text-align:center;font-size:12px;color:#5E5E5E;}
  canvas{display:block;margin-bottom:6px;background:#fff;}
  .round{border-radius:22%;}
</style>
</head>
<body>
<script>
/* Draws the site icons: a white Jost "B" on black, with the four strongest
   accord families of the collection as a thin strip underneath, the same mark
   that sits under every bottle in the catalogue. Run it, then read
   window.ICONS (name -> PNG data URL) to save the files. */
const STRIP = [['#5B6340',18.9],['#C9A43A',12],['#A47E8A',11.4],['#B7782C',10.4]];

function draw(size, {pad = 0, strip = true} = {}){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, size, size);
  const inner = size * (1 - pad*2);
  const cx = size/2;
  const fs = inner * 0.62;
  x.fillStyle = '#FFF';
  x.font = `500 ${fs}px Jost`;
  x.textAlign = 'center';
  x.textBaseline = 'alphabetic';
  const m = x.measureText('B');
  const capH = m.actualBoundingBoxAscent;
  const stripH = strip ? Math.max(2, Math.round(inner*0.028)) : 0;
  const gapToStrip = strip ? inner*0.075 : 0;
  const block = capH + gapToStrip + stripH;
  const top = (size - block)/2;
  x.fillText('B', cx + inner*0.008, top + capH);
  if(strip){
    const w = inner*0.40, y = top + capH + gapToStrip;
    const total = STRIP.reduce((s,[,v])=>s+v,0);
    const gap = Math.max(1, inner*0.008);
    let sx = cx - w/2;
    STRIP.forEach(([hex,v])=>{
      const sw = w*v/total;
      x.fillStyle = hex;
      x.fillRect(Math.round(sx), Math.round(y), Math.max(1, Math.round(sw - gap)), stripH);
      sx += sw;
    });
  }
  return c;
}

document.fonts.load('500 100px Jost').then(()=>{
  const specs = {
    'icon-512.png':          [512, {}],
    'icon-192.png':          [192, {}],
    'apple-touch-icon.png':  [180, {}],
    'icon-512-maskable.png': [512, {pad:.12}],
    'favicon-32.png':        [32,  {pad:-.14, strip:false}],
  };
  window.ICONS = {};
  for(const [name,[size,opts]] of Object.entries(specs)){
    const c = draw(size, opts);
    window.ICONS[name] = c.toDataURL('image/png');
    const f = document.createElement('figure');
    if(name !== 'favicon-32.png') c.className = 'round';
    c.style.width = Math.min(size, 256) + 'px';
    f.appendChild(c);
    f.appendChild(Object.assign(document.createElement('figcaption'), {textContent:name}));
    document.body.appendChild(f);
  }
  window.ICONS_READY = true;
});
</script>
</body>
</html>
