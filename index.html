/* ============ MOTION ENGINE ============ */
const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let scrollTriggers = [];

function easeOutExpo(t){ return t===1 ? 1 : 1 - Math.pow(2, -10*t); }
function runCountUp(el){
  const target = Number(el.getAttribute('data-countup'));
  if(REDUCE_MOTION || !isFinite(target)){ el.textContent = target; return; }
  const dur = 900, start = performance.now();
  function tick(now){
    const p = Math.min(1, (now-start)/dur);
    el.textContent = Math.round(target * easeOutExpo(p));
    if(p<1){ requestAnimationFrame(tick); }
    else if(window.gsap){
      gsap.fromTo(el, {scale:1}, {scale:1.1, duration:0.16, ease:'power2.out', yoyo:true, repeat:1, transformOrigin:'left center'});
    }
  }
  requestAnimationFrame(tick);
}

function initObservers(root){
  scrollTriggers.forEach(t=>t.kill());
  scrollTriggers = [];
  if(REDUCE_MOTION || !window.gsap){
    root.querySelectorAll('.reveal-io').forEach(el=>el.classList.add('in-view'));
    root.querySelectorAll('.bar-fill').forEach(el=>el.classList.add('in-view'));
    root.querySelectorAll('[data-countup]').forEach(el=>{ el.textContent = el.getAttribute('data-countup'); });
    return;
  }
  /* ScrollTrigger's onEnter is edge-triggered: it won't fire for elements already
     inside the trigger zone at creation time (eg. the hero, visible with no scroll
     yet). Split into "already visible -> animate now" vs "below the fold -> wire
     a real ScrollTrigger for when the user scrolls to it". */
  const vh = window.innerHeight;
  function splitByVisibility(els, thresholdFrac){
    const immediate = [], deferred = [];
    els.forEach(el=>{
      const top = el.getBoundingClientRect().top;
      (top < vh * thresholdFrac ? immediate : deferred).push(el);
    });
    return {immediate, deferred};
  }

  const revealEls = Array.from(root.querySelectorAll('.reveal-io'));
  if(revealEls.length){
    gsap.set(revealEls, {opacity:0, y:20});
    const {immediate, deferred} = splitByVisibility(revealEls, 0.88);
    if(immediate.length){
      gsap.to(immediate, {opacity:1, y:0, duration:0.8, ease:'power3.out', stagger:0.07, clearProps:'transform'});
    }
    deferred.forEach((el, i)=>{
      scrollTriggers.push(ScrollTrigger.create({
        trigger: el, start: 'top 88%', once: true,
        onEnter: () => gsap.to(el, {opacity:1, y:0, duration:0.8, ease:'power3.out', delay:(i%6)*0.05, clearProps:'transform'})
      }));
    });
  }

  const barEls = Array.from(root.querySelectorAll('.bar-fill'));
  if(barEls.length){
    const {immediate, deferred} = splitByVisibility(barEls, 0.92);
    immediate.forEach(el=>el.classList.add('in-view'));
    deferred.forEach(el=>{
      scrollTriggers.push(ScrollTrigger.create({
        trigger: el, start: 'top 92%', once: true,
        onEnter: () => el.classList.add('in-view')
      }));
    });
  }

  const countEls = Array.from(root.querySelectorAll('[data-countup]'));
  if(countEls.length){
    const {immediate, deferred} = splitByVisibility(countEls, 0.94);
    immediate.forEach(el=>runCountUp(el));
    deferred.forEach(el=>{
      scrollTriggers.push(ScrollTrigger.create({
        trigger: el, start: 'top 94%', once: true,
        onEnter: () => runCountUp(el)
      }));
    });
  }
}

/* subtle scroll-scrub depth on the landing hero's watermark numeral and photo.
   both animate a dedicated inner wrapper so GSAP's transform never fights the
   CSS transforms already used for centering (.hero-watermark/.hero-photo) and
   the pointer tilt (.hero-photo-disc). */
function initHeroParallax(){
  if(REDUCE_MOTION || !window.gsap) return;
  const heroSection = document.querySelector('.landing-hero');
  if(!heroSection) return;
  const wm = heroSection.querySelector('.hero-watermark-num');
  const photo = heroSection.querySelector('.hero-photo-parallax');
  const base = { trigger: heroSection, start: 'top top', end: 'bottom top', scrub: 0.6 };
  if(wm){
    const t = gsap.to(wm, {y: 70, ease: 'none', scrollTrigger: {...base}});
    scrollTriggers.push(t.scrollTrigger);
  }
  if(photo){
    const t = gsap.to(photo, {y: -46, ease: 'none', scrollTrigger: {...base}});
    scrollTriggers.push(t.scrollTrigger);
  }
}

/* horizontal "shelf" pan on the landing page: pins the section and pans the
   track sideways as the user scrolls, so the bottle showcase reads like
   flipping across a physical shelf. Desktop only (matchMedia) - below 860px
   it's a plain native horizontal-scroll row instead, since scroll-hijacking
   fights touch scrolling on mobile. */
let shelfMM = null;
function initShelfPan(){
  if(shelfMM){ shelfMM.revert(); shelfMM = null; }
  const wrap = document.querySelector('.shelf');
  const track = document.querySelector('.shelf-track');
  if(!wrap || !track || REDUCE_MOTION || !window.gsap) return;
  shelfMM = gsap.matchMedia();
  shelfMM.add('(min-width: 860px)', () => {
    const distance = () => Math.max(0, track.scrollWidth - wrap.clientWidth);
    const tween = gsap.to(track, {
      x: () => -distance(),
      ease: 'none',
      scrollTrigger: {
        trigger: wrap,
        start: 'top top',
        end: () => '+=' + distance(),
        pin: true,
        scrub: 0.7,
        invalidateOnRefresh: true
      }
    });
    return () => tween.kill();
  });
}

/* tilt + spotlight, delegated so it survives re-renders without rebinding */
if(!REDUCE_MOTION){
  const tiltInited = new WeakSet();
  document.addEventListener('pointermove', (e)=>{
    const el = e.target.closest && e.target.closest('[data-tilt]');
    if(!el) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    el.style.setProperty('--mx', (px*100).toFixed(1) + '%');
    el.style.setProperty('--my', (py*100).toFixed(1) + '%');
    if(window.gsap){
      /* GSAP needs a concrete starting value to interpolate a CSS custom property from;
         without this the first tween on an uninitialized --rx/--ry resolves to NaN. */
      if(!tiltInited.has(el)){ gsap.set(el, {'--rx':'0deg', '--ry':'0deg'}); tiltInited.add(el); }
      gsap.to(el, {
        '--ry': ((px-0.5) * 6).toFixed(2) + 'deg',
        '--rx': ((0.5-py) * 6).toFixed(2) + 'deg',
        duration:0.5, ease:'power3.out', overwrite:true
      });
    } else {
      el.style.setProperty('--ry', ((px-0.5) * 6).toFixed(2) + 'deg');
      el.style.setProperty('--rx', ((0.5-py) * 6).toFixed(2) + 'deg');
    }
  }, { passive:true });
  document.addEventListener('pointerleave', (e)=>{
    const el = e.target.closest && e.target.closest('[data-tilt]');
    if(!el) return;
    if(window.gsap) gsap.to(el, {'--rx':'0deg', '--ry':'0deg', duration:0.7, ease:'elastic.out(1, 0.4)', overwrite:true});
    else { el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg'); }
  }, true);

  /* magnetic buttons */
  document.addEventListener('pointermove', (e)=>{
    const el = e.target.closest && e.target.closest('[data-magnetic]');
    if(!el) return;
    const r = el.getBoundingClientRect();
    const mx = (e.clientX - (r.left+r.width/2)) * 0.28;
    const my = (e.clientY - (r.top+r.height/2)) * 0.28;
    if(window.gsap) gsap.to(el, {x:mx, y:my, duration:0.45, ease:'power3.out', overwrite:true});
    else el.style.transform = `translate(${mx.toFixed(1)}px, ${my.toFixed(1)}px)`;
  }, { passive:true });
  document.addEventListener('pointerleave', (e)=>{
    const el = e.target.closest && e.target.closest('[data-magnetic]');
    if(!el) return;
    if(window.gsap) gsap.to(el, {x:0, y:0, duration:0.65, ease:'elastic.out(1, 0.35)', overwrite:true});
    else el.style.transform = '';
  }, true);
}

          if(statusEl) statusEl.textContent = 'Could not remove — check your connection and try again.';
        }
      } else {
        adminRemoveConfirmId = id;
        const search = document.getElementById('adminSearch');
        list.innerHTML = renderAdminList(search ? search.value : '');
        bindAdminList();
      }
    });
  });

  list.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = Number(btn.getAttribute('data-edit'));
      adminEditId = adminEditId === id ? null : id;
      const search = document.getElementById('adminSearch');
      list.innerHTML = renderAdminList(search ? search.value : '');
      bindAdminList();
      if(adminEditId === id){
        const record = DATA.find(d=>d.id===id);
        pendingEditImage = record ? (record.image || '') : '';
        bindImageDropzoneFor('e'+id, pendingEditImage, v=>{ pendingEditImage = v; });
        const firstInput = document.querySelector(`#editForm-${id} input[name="name"]`);
        if(firstInput) firstInput.focus();
      }
    });
  });
  list.querySelectorAll('[data-cancel-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      adminEditId = null;
      const search = document.getElementById('adminSearch');
      list.innerHTML = renderAdminList(search ? search.value : '');
      bindAdminList();
    });
  });
  list.querySelectorAll('form[id^="editForm-"]').forEach(form=>{
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const id = Number(form.id.replace('editForm-',''));
      const errEl = document.getElementById(`editFormError-${id}`);
      errEl.hidden = true;
      const fields = readFragranceFormFields(form, pendingEditImage);
      if(!fields.name.trim() || !fields.brand.trim() || !fields.olfactoryFamily.trim() || !fields.topNotes.trim()){
        errEl.hidden = false; errEl.textContent = 'Name, brand, family and at least one top note are required.';
        return;
      }
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalLabel = submitBtn.textContent;
      submitBtn.disabled = true; submitBtn.textContent = 'Saving…';
      try{
        const patch = fieldsToItemPatch(fields);
        await updateFragrance(id, patch);
        adminEditId = null;
        window.__adminFlash = `Updated ${patch.brand} - ${patch.name}.`;
        render();
      }catch(err){
        console.warn('updateFragrance failed', err);
        errEl.hidden = false; errEl.textContent = 'Could not save to the database. Check your connection and try again.';
        submitBtn.disabled = false; submitBtn.textContent = originalLabel;
      }
    });
  });
}

function softRerenderCatalogue(){
  const results = DATA.filter(matchesFilters).sort(byBrandThenName);
  document.querySelector('.result-count').textContent = results.length + ' of ' + DATA.length;
  const gridWrap = document.querySelector('.wrap:has(.grid), .wrap:has(.empty)');
  if(!gridWrap) return;
  const doSwap = ()=>{
    gridWrap.innerHTML = results.length ? `<div class="grid">${results.map((d,i)=>card(d,i)).join('')}</div>` : emptyState('No fragrance matches these filters. Try clearing one.');
    bindMain();
  };
  const existing = gridWrap.querySelectorAll('.card, .empty');
  if(REDUCE_MOTION || !existing.length || !window.gsap){
    doSwap();
  } else {
    gsap.to(existing, {opacity:0, y:-6, duration:0.15, ease:'power2.in', stagger:0.01, overwrite:true, onComplete: doSwap});
  }
}
