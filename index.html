<title>Ben's Fragrance Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500;1,6..96,600&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  /* ---------- tokens: Black & Tan (editorial, single-accent) ---------- */
  :root{
    --bg:#0F0E0C;
    --surface:#171512;
    --surface-2:#211E19;
    --ink:#F3EEE3;
    --ink-muted:#A79D8B;
    --ink-faint:#6E6656;
    --line:#2B2721;
    --line-strong:#3D372C;
    --accent:#C2603E;
    --accent-strong:#D97246;
    --accent-ink:#171512;
    --accent-soft:rgba(194,96,62,0.15);
    --tan:#F3EEE3;
    --radius:3px;
    --shadow-1:0 1px 2px rgba(0,0,0,0.3);
    --shadow-2:0 24px 48px -20px rgba(0,0,0,0.55);
    --font-display:'Bodoni Moda', Georgia, serif;
    --font-body:'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'Courier New', monospace;
    --maxw:1320px;
    --photo-grade: contrast(1.06) saturate(.92) brightness(1.03);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  select,input{font:inherit;color:inherit;}
  ::selection{background:var(--accent-soft);color:var(--accent-strong);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(1.1rem,3vw,2.5rem);}

  h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;text-wrap:balance;}
  h1{font-family:var(--font-display);font-weight:400;letter-spacing:0;}
  .eyebrow{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

  /* ---------- skip link ---------- */
  .skip-link{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:.6rem 1rem;z-index:200;}
  .skip-link:focus{left:1rem;top:1rem;}

  /* ---------- topbar ---------- */
  .topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar-inner{display:flex;align-items:center;gap:1.6rem;height:64px;}
  .brand{font-family:var(--font-display);font-size:1.15rem;font-weight:600;font-style:italic;letter-spacing:.01em;white-space:nowrap;color:var(--ink);}
  .brand em{font-style:normal;color:var(--ink);}
  .nav{display:flex;align-items:center;gap:.15rem;flex:1;min-width:0;}
  .nav a{font-size:.86rem;color:var(--ink-muted);padding:.5rem .65rem;border-radius:var(--radius);white-space:nowrap;transition:color .15s ease, background .15s ease;}
  .nav a:hover{color:var(--ink);background:var(--surface-2);}
  .nav a.active{color:var(--ink);font-weight:600;}
  .topbar-tools{display:flex;align-items:center;gap:.4rem;margin-left:auto;}
  .icon-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius);color:var(--ink-muted);}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .icon-btn.active{background:var(--accent-soft);color:var(--accent-strong);}
  .hamburger{display:none;}
  .mobile-nav{display:none;}

  @media (max-width:860px){
    .nav{display:none;}
    .hamburger{display:flex;}
    .mobile-nav.open{display:flex;}
    .mobile-nav{position:fixed;inset:64px 0 0 0;background:var(--bg);z-index:49;flex-direction:column;padding:1rem clamp(1.1rem,3vw,2.5rem);gap:.1rem;overflow:auto;}
    .mobile-nav a{padding:.85rem .2rem;border-bottom:1px solid var(--line);font-size:1rem;}
  }

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:.55rem;padding:.85rem 1.5rem;border-radius:999px;font-family:var(--font-body);font-size:.82rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;transition:transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease, background .2s ease, border-color .2s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.3);}
  .btn-primary:hover{background:var(--accent-strong);box-shadow:0 10px 24px -8px rgba(194,96,62,.55);transform:translateY(-1px);}
  .btn-ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft);}
  .btn-sm{padding:.55rem 1rem;font-size:.72rem;}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;padding:clamp(5rem,10vw,7rem) 0 clamp(2.6rem,5vw,3.6rem);}
  .hero-watermark{position:absolute;top:50%;left:-.03em;transform:translateY(-50%);font-family:var(--font-display);font-style:italic;font-weight:400;font-size:clamp(9rem,22vw,17rem);color:var(--ink);opacity:.05;letter-spacing:-.02em;line-height:1;pointer-events:none;user-select:none;white-space:nowrap;z-index:0;}
  .hero-copy{position:relative;z-index:2;max-width:640px;}
  .hero-kicker{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:1.5rem;}
  .hero-kicker .rule{width:22px;height:1px;background:var(--accent);display:inline-block;}
  .hero-kicker .hero-count{font-size:.95rem;font-weight:500;color:var(--accent);letter-spacing:0;text-transform:none;font-family:var(--font-mono);}
  .hero h1{font-size:clamp(3rem,6.4vw,5.6rem);line-height:1.04;letter-spacing:-.005em;padding-bottom:.15em;color:var(--ink);}
  .hero h1 em{font-style:italic;color:var(--accent);}
  .hero p{margin:1.3rem 0 2rem;max-width:40ch;color:var(--ink-muted);font-size:1.02rem;line-height:1.6;}
  .hero-cta{display:flex;gap:.8rem;flex-wrap:wrap;}
  .hero-mini-stats{display:flex;gap:clamp(1.6rem,3vw,2.6rem);margin-top:2.8rem;padding-top:1.5rem;border-top:1px solid var(--line);}
  .hero-mini-stats .n{display:block;font-family:var(--font-display);font-style:italic;font-size:1.7rem;color:var(--ink);}
  .hero-mini-stats .l{display:block;font-family:var(--font-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:.25rem;}
  .hero-photo{position:absolute;top:50%;right:clamp(-2%,2vw,4%);transform:translateY(-50%);width:min(46vw,620px);aspect-ratio:4/5;z-index:1;overflow:visible;}
  .hero-photo::before{content:'';position:absolute;inset:-10%;background:radial-gradient(circle at var(--mx,50%) var(--my,42%), var(--accent-soft), transparent 62%);opacity:0;transition:opacity .5s ease;filter:blur(6px);pointer-events:none;z-index:0;}
  .hero-photo:hover::before{opacity:1;}
  .hero-photo-disc{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform:perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s cubic-bezier(.16,1,.3,1);z-index:1;}
  .hero-photo-disc img{width:94%;height:94%;object-fit:contain;filter:var(--photo-grade) drop-shadow(0 40px 60px rgba(0,0,0,.55)) drop-shadow(0 4px 12px rgba(0,0,0,.3));transition:transform .6s cubic-bezier(.16,1,.3,1);}
  .hero-photo:hover .hero-photo-disc img{transform:scale(1.035);}
  .marquee{position:relative;z-index:2;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;background:var(--surface);}
  .marquee-track{display:flex;width:max-content;animation:marqueeScroll 34s linear infinite;}
  .marquee-track span{font-family:var(--font-display);font-style:italic;font-size:1.3rem;color:var(--ink-faint);padding:1rem 2.2rem;white-space:nowrap;border-right:1px solid var(--line);}
  .marquee-track span b{color:var(--ink);font-style:normal;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;margin-right:.6rem;font-weight:400;}
  @keyframes marqueeScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @media (prefers-reduced-motion: reduce){ .marquee-track{animation:none;} }
  @media (max-width:860px){
    .hero{min-height:auto;display:flex;flex-direction:column;padding-top:2.6rem;}
    .hero-copy{order:1;max-width:none;}
    .hero-photo{order:2;position:relative;top:auto;right:auto;transform:none;width:100%;max-width:420px;margin:2.8rem auto 0;aspect-ratio:1/1;}
    .hero-watermark{display:none;}
  }
  @media (max-width:520px){
    .hero h1{font-size:clamp(2.3rem,10vw,3rem);}
    .hero-mini-stats{gap:1.3rem;}
  }

  /* ---------- stat strip ---------- */
  .stat-strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .stat-strip .wrap{display:grid;grid-template-columns:repeat(4,1fr);}
  .stat-cell{padding:1.7rem 1rem;border-left:1px solid var(--line);}
  .stat-cell:first-child{border-left:0;}
  .stat-cell .num{display:block;font-size:clamp(1.5rem,3vw,2.1rem);color:var(--ink);}
  .stat-cell .label{font-size:.78rem;color:var(--ink-muted);margin-top:.2rem;}
  @media (max-width:700px){
    .stat-strip .wrap{grid-template-columns:repeat(2,1fr);}
    .stat-cell:nth-child(3){border-left:0;}
    .stat-cell{border-top:1px solid var(--line);}
    .stat-cell:nth-child(1),.stat-cell:nth-child(2){border-top:0;}
  }

  section{padding:clamp(2.4rem,5vw,3.6rem) 0;}
  .section-head{margin-bottom:1.6rem;}
  .section-head h2{font-size:clamp(1.6rem,2.8vw,2.2rem);font-style:italic;}
  .section-head p{color:var(--ink-muted);margin:.6rem 0 0;max-width:60ch;}
  .home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:2rem;flex-wrap:wrap;}
  .home-count{text-align:right;flex-shrink:0;}
  .home-count .num{display:block;font-family:var(--font-display);font-style:italic;font-weight:400;font-size:clamp(4.5rem,11vw,8.5rem);line-height:.9;color:var(--ink);font-variant-numeric:tabular-nums;}
  .home-count .lbl{display:block;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:.5rem;}
  @media (max-width:700px){ .home-count{text-align:left;} }

  /* ---------- family bento ---------- */
  .fam-grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:120px;gap:.9rem;}
  .fam-tile{grid-column:span 2;position:relative;border-radius:var(--radius);overflow:hidden;padding:1.1rem 1.2rem;display:flex;flex-direction:column;justify-content:flex-end;background:var(--surface);border:1px solid var(--line);color:var(--ink);isolation:isolate;}
  .fam-tile:nth-child(1),.fam-tile:nth-child(4){grid-row:span 2;grid-column:span 3;background:var(--accent);border-color:var(--accent);}
  .fam-tile:nth-child(1) .fam-name,.fam-tile:nth-child(4) .fam-name{color:var(--accent-ink);font-size:1.7rem;}
  .fam-tile:nth-child(1) .fam-count,.fam-tile:nth-child(4) .fam-count{color:var(--accent-ink);opacity:.75;}
  .fam-tile .fam-name{font-family:var(--font-display);font-size:1.25rem;font-weight:600;font-style:italic;color:var(--accent);}
  .fam-tile .fam-count{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.03em;color:var(--ink-faint);margin-top:.2rem;}
  @media (max-width:860px){
    .fam-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:110px;}
    .fam-tile{grid-column:span 1 !important;grid-row:span 1 !important;}
  }

  /* ---------- home menu grid ---------- */
  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;}
  .menu-tile{position:relative;border:1px solid var(--line);border-radius:var(--radius);padding:1.3rem 1.3rem 1.5rem;background:var(--surface);display:flex;flex-direction:column;gap:.5rem;min-height:150px;transition:box-shadow .25s ease, background .25s ease, transform .25s ease, border-color .25s ease;}
  .menu-tile:hover{background:var(--surface-2);border-color:var(--accent);}
  .menu-tile-n{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);}
  .menu-tile-title{font-family:var(--font-display);font-size:1.15rem;font-style:italic;color:var(--ink);}
  .menu-tile-desc{font-size:.82rem;color:var(--ink-muted);line-height:1.5;flex:1;}
  .menu-tile-arrow{align-self:flex-end;color:var(--accent);}
  .menu-tile-arrow svg{display:block;}
  @media (max-width:860px){ .menu-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .menu-grid{grid-template-columns:1fr;} }

  /* ---------- landing ---------- */
  .is-landing .topbar, .is-landing .footer{display:none;}

  /* ---------- cta band ---------- */
  .cta-band{background:var(--ink);color:var(--bg);border-radius:var(--radius);}
  .cta-band-inner{padding:clamp(2rem,5vw,3.2rem);display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;}
  .cta-band h2{color:inherit;font-size:clamp(1.4rem,2.6vw,1.9rem);}
  .cta-band .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .cta-band .btn-primary:hover{background:var(--accent-strong);}

  /* ---------- filter bar ---------- */
  .filter-bar{position:sticky;top:64px;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:.9rem 0;}
  .filter-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;}
  .search-field{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line-strong);border-radius:var(--radius);padding:.5rem .7rem;background:var(--surface);flex:1;min-width:180px;max-width:340px;}
  .search-field input{border:0;background:none;outline:0;width:100%;font-size:.88rem;color:var(--ink);}
  .search-field svg{flex-shrink:0;color:var(--ink-faint);}
  select.chip-select{border:1px solid var(--line-strong);border-radius:var(--radius);padding:.5rem .6rem;background:var(--surface);font-size:.83rem;color:var(--ink);}
  .result-count{margin-left:auto;font-family:var(--font-mono);font-size:.78rem;color:var(--ink-muted);}
  .active-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem;}
  .active-chips:empty{margin-top:0;}
  .chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.76rem;padding:.28rem .55rem;border-radius:var(--radius);background:var(--accent-soft);color:var(--accent-strong);}
  .chip button{display:flex;}

  /* ---------- catalogue grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:2.4rem 1.6rem;padding:2.4rem 0 3.5rem;}
  .card{background:transparent;border:0;border-radius:0;overflow:visible;transition:transform .3s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;}
  .card:hover{transform:translateY(-3px);}
  .swatch{display:block;aspect-ratio:4/5;position:relative;isolation:isolate;background:var(--surface);border:1px solid var(--line);overflow:hidden;transition:border-color .3s ease;}
  .swatch:hover{border-color:var(--accent);}
  .swatch-fill{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;background:radial-gradient(120% 100% at 50% 30%, var(--surface-2), var(--surface) 75%);color:var(--ink-faint);}
  .swatch-fill svg{opacity:.5;}
  .swatch-fill span{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;}
  .swatch-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10%;transition:transform .6s cubic-bezier(.16,1,.3,1);filter:var(--photo-grade);}
  .swatch-fam{position:absolute;left:.8rem;top:.8rem;font-family:var(--font-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);z-index:2;}
  .card-body{padding:1.1rem .1rem 0;display:flex;flex-direction:column;gap:.4rem;flex:1;}
  .card-body .brand-line{font-size:.72rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);}
  .card-body h3{font-size:1.28rem;font-style:italic;font-weight:400;}
  .card-body h3 a{color:inherit;transition:color .25s ease;}
  .card-body h3 a:hover{color:var(--accent);}
  .card-notes{font-size:.82rem;color:var(--ink-muted);}
  .card-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.15rem;}
  .tag{font-size:.7rem;padding:.2rem .5rem;border-radius:var(--radius);border:1px solid var(--line);color:var(--ink-muted);}
  .card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:.9rem;border-top:1px solid var(--line);margin-top:.8rem;}
  .card-foot .btn{padding:0;border:0;background:none;box-shadow:none;border-radius:0;color:var(--ink-muted);font-size:.72rem;letter-spacing:.06em;}
  .card-foot .btn:hover{color:var(--accent);background:none;box-shadow:none;}

  .empty{padding:3.5rem 1rem;text-align:center;color:var(--ink-muted);}
  .empty h3{color:var(--ink);margin-bottom:.4rem;}

  /* ---------- drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(10,14,12,.4);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:98;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .28s cubic-bezier(.16,1,.3,1);z-index:99;overflow-y:auto;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:1.1rem 1.3rem;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;}
  .drawer-image{aspect-ratio:4/3;overflow:hidden;background:var(--surface-2);}
  .drawer-image img{width:100%;height:100%;object-fit:cover;display:block;filter:var(--photo-grade);}
  .drawer-body{padding:1.3rem;}
  .drawer-body h3{font-size:1.6rem;margin-bottom:.15rem;}
  .pyramid{display:flex;flex-direction:column;align-items:center;gap:.7rem;margin:1.7rem 0 1.9rem;}
  .pyramid-tier{width:100%;text-align:center;padding:1.1rem 1.4rem;background:var(--surface);border:1px solid var(--line);transition:border-color .3s ease;}
  .pyramid-tier:hover{border-color:var(--line-strong);}
  .pyramid-tier.heart{width:78%;background:var(--surface-2);}
  .pyramid-tier.base{width:56%;background:var(--surface-2);border-color:var(--accent-soft);}
  .pyramid-tier .eyebrow{text-align:center;}
  .pyramid-notes-text{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:1.05rem;color:var(--ink);line-height:1.5;margin-top:.4rem;}
  @media (max-width:520px){ .pyramid-tier.heart{width:88%;} .pyramid-tier.base{width:76%;} }
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin:1.2rem 0;padding:1rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .meta-item .eyebrow{margin-bottom:.25rem;}
  .meta-item div{font-size:.88rem;}
  .layer-list{display:flex;flex-direction:column;gap:.4rem;margin-top:.4rem;}
  .layer-row{display:flex;align-items:center;gap:.5rem;font-size:.85rem;padding:.4rem .6rem;border-radius:var(--radius);background:var(--surface-2);}
  .layer-row.restrict{color:#a24444;}
  .layer-row.restrict{background:color-mix(in srgb, #a24444 12%, var(--surface-2));}

  /* ---------- brand / index ---------- */
  .brand-accordion{display:flex;flex-direction:column;border-top:1px solid var(--line-strong);}
  .brand-accordion details{border-bottom:1px solid var(--line);}
  .brand-accordion summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:1.3rem .2rem;cursor:pointer;font-family:var(--font-display);font-style:italic;font-weight:400;font-size:clamp(1.25rem,2.4vw,1.6rem);transition:color .25s ease;}
  .brand-accordion summary:hover{color:var(--accent);}
  .brand-accordion summary::-webkit-details-marker{display:none;}
  .brand-accordion summary .count{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-style:normal;}
  .brand-accordion summary svg{transition:transform .2s ease;color:var(--ink-faint);flex-shrink:0;}
  .brand-accordion details[open] summary svg{transform:rotate(180deg);}

  const res = await fetch(`${SUPABASE_URL}/rest/v1/fragrances?select=data&order=id.asc`, { headers: SB_HEADERS });

  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/add_fragrance`, {

}

let RAW_DATA = EMBEDDED_DATA.map(d=>({...d}));
let unlocked = false;

const SEASONS = ['Spring','Summer','Fall','Winter'];
let DATA, BRANDS, FAMILIES, OCCASIONS, MOODS, ALL_NOTES;
let dbStatus = 'loading'; // 'loading' | 'live' | 'offline'

function rebuildData(){
  DATA = RAW_DATA.map(d=>({...d, label: d.brand + ' - ' + d.name}));
  BRANDS = [...new Set(DATA.map(d=>d.brand))].sort((a,b)=>a.localeCompare(b));
  FAMILIES = [...new Set(DATA.map(d=>d.olfactoryFamily))].sort((a,b)=>a.localeCompare(b));
  OCCASIONS = [...new Set(DATA.flatMap(d=>d.occasion))].sort((a,b)=>a.localeCompare(b));
  MOODS = [...new Set(DATA.flatMap(d=>d.mood))].sort((a,b)=>a.localeCompare(b));
  ALL_NOTES = [...new Set(DATA.flatMap(d=>[...d.topNotes,...d.middleNotes,...d.baseNotes]))];
  const fc = document.getElementById('footCount');
  if(fc) fc.textContent = DATA.length + ' fragrances · ' + BRANDS.length + ' houses';
}
rebuildData();

    }
  }catch(e){
    console.warn('Supabase sync failed, showing the last saved copy.', e);
    dbStatus = 'offline';
  }
  rebuildData();
  render();
}

/* deterministic hash -> hue offset for family swatches (analogous to the single accent hue) */
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return Math.abs(h);}
function famHue(fam){const h=hashStr(fam)%50-25;return h;}
function swatchStyle(fam){return 'filter:hue-rotate(' + famHue(fam) + 'deg) saturate(' + (100+ (hashStr(fam)%25)) + '%);';}

  search:'',
  filters:{brand:'',family:'',season:'',occasion:'',mood:''},

/* ============ ROUTER ============ */
const routes = {
  landing: renderLanding,
  home: renderHome,
  catalogue: renderCatalogue,
  brand: renderBrand,
  index: renderIndex,
  explore: renderExplore,
  stats: renderStats,
  layering: renderLayering,
  admin: renderAdmin,
};

function currentRoute(){
  const h = location.hash.replace('#/','').split('?')[0];
  return routes[h] ? h : 'home';
}

function paintRoute(){
  const route = currentRoute();
  document.querySelectorAll('.nav a, .mobile-nav a').forEach(a=>{
    a.classList.toggle('active', a.getAttribute('href') === '#/'+route);
  });
  const adminBtn = document.getElementById('adminBtn');
  if(adminBtn) adminBtn.classList.toggle('active', route==='admin');
  document.querySelector('.app').classList.toggle('is-landing', route==='landing');
  const main = document.getElementById('main');
  main.innerHTML = routes[route]();
  document.getElementById('mobileNav').classList.remove('open');
  window.scrollTo({top:0});
  bindMain();
  setTimeout(()=>{ main.classList.remove('route-leave'); }, 20);
}
function render(){
  const main = document.getElementById('main');
  if(REDUCE_MOTION || !main.innerHTML.trim()){
    paintRoute();
    return;
  }
  main.classList.add('route-leave');
  setTimeout(paintRoute, 190);
}
window.addEventListener('hashchange', render);

/* ============ HELPERS ============ */
function esc(s){return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function countBy(arr){const m={};arr.forEach(v=>{m[v]=(m[v]||0)+1;});return m;}
function topEntries(map, n){return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n);}

function matchesFilters(d){
  const q = state.search.trim().toLowerCase();
  if(q){
    const hay = (d.name+' '+d.brand+' '+d.olfactoryFamily+' '+d.topNotes.join(' ')+' '+d.middleNotes.join(' ')+' '+d.baseNotes.join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  const f = state.filters;
  if(f.brand && d.brand !== f.brand) return false;
  if(f.family && d.olfactoryFamily !== f.family) return false;
  if(f.season && !d.season.includes(f.season)) return false;
  if(f.occasion && !d.occasion.includes(f.occasion)) return false;
  if(f.mood && !d.mood.includes(f.mood)) return false;
  return true;
}

function card(d, idx){

      <span class="swatch-fam">${esc(d.olfactoryFamily)}</span>
    </a>
    <div class="card-body">
      <div class="brand-line">${esc(d.brand)}</div>
      <h3><a href="#" data-open="${d.id}">${esc(d.name)}</a></h3>

/* ============ VIEW: EXPLORE ============ */
function exploreDims(){
  return {
    mood: MOODS,
    season: SEASONS,
    occasion: OCCASIONS,
    family: FAMILIES,
  };
}
function tagMatches(dim, tag, d){
  if(dim==='family') return d.olfactoryFamily===tag;
  return d[dim].includes(tag);
}
function renderExplore(){
  const params = new URLSearchParams((location.hash.split('?')[1]||''));
  if(params.get('dim')) state.explore.dim = params.get('dim');
  if(params.get('tag')) state.explore.tag = params.get('tag');

  const dims = exploreDims();
  const dim = state.explore.dim;
  const tags = dims[dim];
  const counts = {};
  tags.forEach(t=>{ counts[t] = DATA.filter(d=>tagMatches(dim,t,d)).length; });
  const active = state.explore.tag;
  const results = active ? DATA.filter(d=>tagMatches(dim,active,d)) : [];

  return `
  <div class="wrap">
    <section>
      <div class="section-head reveal-io">
        <h2>Explore</h2>
        <p>Browse the collection by mood, season, occasion or olfactory family.</p>

function renderStats(){
  const famCounts = countBy(DATA.map(d=>d.olfactoryFamily));
  const seasonCounts = countBy(DATA.flatMap(d=>d.season));
  const moodCounts = countBy(DATA.flatMap(d=>d.mood));
  const noteCounts = countBy(DATA.flatMap(d=>[...d.topNotes,...d.middleNotes,...d.baseNotes]));

  const topFam = topEntries(famCounts,8);
  const seasonEntries = SEASONS.map(s=>[s, seasonCounts[s]||0]);
  const topMood = topEntries(moodCounts,8);
  const topNotes = topEntries(noteCounts,10);

  return `

    <section>

        <h2>Statistics</h2>
        <p>A quantitative read on the collection as it stands today.</p>
      </div>

        ${barBlock('By season', seasonEntries, Math.max(...seasonEntries.map(e=>e[1]),1), 1)}
        ${barBlock('Top moods', topMood, topMood[0][1], 2)}
        ${barBlock('Most-used notes', topNotes, topNotes[0][1], 3)}
      </div>
    </section>
  </div>`;
}

function nextFragranceId(){
  return RAW_DATA.length ? Math.max(...RAW_DATA.map(d=>d.id)) + 1 : 1;
}
async function removeFragrance(id){
  id = Number(id);
  await sbRemove(id);
  RAW_DATA = RAW_DATA.filter(d=>d.id!==id);

}
async function addFragrance(fields){
  const item = {
    id: nextFragranceId(),
    name: fields.name.trim(),
    brand: fields.brand.trim(),
    olfactoryFamily: fields.olfactoryFamily.trim(),
    topNotes: fields.topNotes.split(',').map(s=>s.trim()).filter(Boolean),
    middleNotes: fields.middleNotes.split(',').map(s=>s.trim()).filter(Boolean),
    baseNotes: fields.baseNotes.split(',').map(s=>s.trim()).filter(Boolean),
    season: fields.season,
    timeOfDay: fields.timeOfDay,
    occasion: fields.occasion,
    projection: fields.projection,
    longevity: fields.longevity,
    mood: fields.mood.split(',').map(s=>s.trim()).filter(Boolean),
    personalNotes: fields.personalNotes.trim(),
    rating: 0,
    layeringPartners: [],
    layeringRestrictions: [],
  };
  const picks = autoLayeringPicks(item);
  item.layeringPartners = picks.partners;
  item.layeringRestrictions = picks.restrictions;
  await sbAdd(item);
  RAW_DATA.push(item);
  rebuildData();

}

/* ============ LAYERING ANALYSIS ENGINE ============ */
/* Notes are grouped into broad accord families (perfumery-standard groupings),
   then two fragrances are scored by how their families interact, backed up by
   any explicitly recorded partner/restriction pairs from the collection data. */
const NOTE_CATEGORIES = [
  ['citrus', ['bergamot','lemon','lime','mandarin','orange','grapefruit','yuzu','citrus','neroli','petitgrain']],
  ['aquatic', ['marine','sea salt','sea ','ozonic','aquatic','driftwood','water lily','rain']],
  ['green', ['green','galbanum','fig leaf','grass','violet leaf','basil','mint','thyme','rosemary','sage','lavender','herbal']],
  ['floral', ['rose','jasmine','lily','muguet','orange blossom','peony','tuberose','ylang','magnolia','heliotrope','freesia','floral','geranium','lilac','mimosa','osmanthus','orchid']],
  ['fruity', ['apple','pear','peach','berry','cassis','raspberry','passion fruit','fig','plum','apricot','coconut','pineapple','mango','fruit','melon','banana','cherry','pomegranate','lychee']],
  ['spicy', ['pepper','cardamom','clove','cinnamon','ginger','nutmeg','saffron','anise','spice','chili','coriander','pink pepper']],
  ['woody', ['sandalwood','cedarwood','cedar','vetiver','patchouli','oud','agarwood','wood','oakmoss','pine','vetyver']],
  ['amber', ['amber','benzoin','labdanum','vanilla','tonka','balsam','myrrh','resin']],
  ['musk', ['musk','ambrette','ambergris']],
  ['gourmand', ['chocolate','caramel','coffee','honey','praline','cocoa','sugar','milk','almond','gourmand','cream','biscuit','marshmallow','tea']],
  ['smoky', ['leather','smoke','tobacco','birch tar','incense','suede','tar']],
  ['powdery', ['iris','orris','powder','violet']],
];
function categorize(note){
  const n = note.toLowerCase();
  for(const [cat, kws] of NOTE_CATEGORIES){ if(kws.some(k=>n.includes(k))) return cat; }
  return 'other';
}
/* pairwise affinity between accord families, -2 (clash) to +2 (classic combo). unlisted pairs default to 0 (neutral). */
const AFFINITY_PAIRS = [
  ['citrus','woody',2],['citrus','aquatic',1],['citrus','floral',1],['citrus','spicy',1],['citrus','green',1],
  ['citrus','smoky',-1],['citrus','powdery',-1],['citrus','gourmand',-1],
  ['floral','musk',2],['floral','woody',2],['floral','amber',1],['floral','green',1],['floral','fruity',1],
  ['floral','smoky',-1],['floral','powdery',1],
  ['woody','amber',2],['woody','spicy',2],['woody','musk',2],['woody','smoky',1],['woody','gourmand',1],['woody','green',1],['woody','powdery',1],
  ['amber','gourmand',2],['amber','spicy',2],['amber','smoky',1],['amber','musk',2],
  ['spicy','gourmand',1],['spicy','smoky',1],
  ['musk','gourmand',1],['musk','powdery',1],['musk','fruity',1],
  ['aquatic','green',1],['aquatic','woody',1],['aquatic','amber',-1],['aquatic','gourmand',-1],['aquatic','smoky',-1],
  ['green','woody',1],['green','spicy',1],
  ['fruity','musk',1],['fruity','gourmand',1],['fruity','smoky',-1],['fruity','woody',1],
  ['smoky','gourmand',0],['smoky','amber',1],
  ['gourmand','powdery',0],
];
const AFF = {};
AFFINITY_PAIRS.forEach(([a,b,s])=>{ AFF[a+'|'+b]=s; AFF[b+'|'+a]=s; });
const SELF_AFF = {citrus:1,aquatic:1,green:1,floral:1,fruity:1,spicy:0,woody:1,amber:0,musk:1,gourmand:0,smoky:0,powdery:1,other:0};
function affinity(c1,c2){ if(c1==='other'||c2==='other') return 0; if(c1===c2) return SELF_AFF[c1]||0; return AFF[c1+'|'+c2] ?? 0; }

const HEAVY_CATS = new Set(['woody','amber','musk','gourmand','smoky']);
const PROJ_W = {Intimate:0.85, Moderate:1, Strong:1.25};

function profileVector(d){
  const weights = {top:1, mid:1.25, base:1.6};
  const vec = {};
  let total = 0;
  d.topNotes.forEach(n=>{ const c=categorize(n); vec[c]=(vec[c]||0)+weights.top; total+=weights.top; });
  d.middleNotes.forEach(n=>{ const c=categorize(n); vec[c]=(vec[c]||0)+weights.mid; total+=weights.mid; });
  d.baseNotes.forEach(n=>{ const c=categorize(n); vec[c]=(vec[c]||0)+weights.base; total+=weights.base; });
  if(total>0) Object.keys(vec).forEach(k=>vec[k]/=total);
  return vec;
}
function weightScore(d){
  const vec = profileVector(d);
  let heavy = 0;
  Object.entries(vec).forEach(([c,w])=>{ if(HEAVY_CATS.has(c)) heavy += w; });
  const noteBulk = d.topNotes.length*0.6 + d.middleNotes.length*1 + d.baseNotes.length*1.5;
  return (heavy*10 + noteBulk) * (PROJ_W[d.projection] || 1);
}
function dominantCats(d, n){
  const vec = profileVector(d);
  return Object.entries(vec).filter(([c])=>c!=='other').sort((a,b)=>b[1]-a[1]).slice(0,n||2).map(e=>e[0]);
}
const CAT_LABEL = {citrus:'citrus',aquatic:'aquatic',green:'green',floral:'floral',fruity:'fruity',spicy:'spicy',woody:'woody',amber:'amber',musk:'musk',gourmand:'gourmand',smoky:'smoky-leather',powdery:'powdery'};

/* the same accord-affinity math analyzePairing uses, pulled out standalone so a newly
   added fragrance can be scored against the whole collection before it has any curated
   layering records of its own */
function pairTotalScore(A, B){
  const vecA = profileVector(A), vecB = profileVector(B);
  let vectorScore = 0;
  Object.entries(vecA).forEach(([c1,w1])=>{
    Object.entries(vecB).forEach(([c2,w2])=>{ vectorScore += w1*w2*affinity(c1,c2); });
  });
  const allA = [...A.topNotes,...A.middleNotes,...A.baseNotes].map(n=>n.toLowerCase());
  const allB = [...B.topNotes,...B.middleNotes,...B.baseNotes].map(n=>n.toLowerCase());
  const sharedNotes = [...new Set(allA.filter(n=>allB.includes(n)))];
  const sharedBonus = Math.min(sharedNotes.length, 3) * 0.35;
  const familyBonus = A.olfactoryFamily===B.olfactoryFamily ? 0.3 : 0;
  return vectorScore + sharedBonus + familyBonus;
}

/* every fragrance in the collection must carry at least 5 layering partners and 5 layering
   restrictions. a fragrance added through the admin panel has no curated records yet, so this
   scores it against every existing fragrance and picks the strongest 5 as partners and the
   weakest 5 as restrictions, mirroring how the curated data itself reads. */
function autoLayeringPicks(newItem){
  const pool = DATA.filter(d=>d.id!==newItem.id);
  const scored = pool.map(d=>({ d, s: pairTotalScore(newItem, d) })).sort((x,y)=>y.s-x.s);
  const n = scored.length;
  const partnerCount = Math.min(5, Math.ceil(n/2));
  const restrictionCount = Math.min(5, n - partnerCount);
  const partners = scored.slice(0, partnerCount).map(x=>x.d.label);
  const restrictions = scored.slice(n - restrictionCount).map(x=>x.d.label).reverse();
  return { partners, restrictions };
}

function analyzePairing(a, b){
  const A = DATA.find(d=>d.label===a), B = DATA.find(d=>d.label===b);
  if(!A||!B) return null;
  const vecA = profileVector(A), vecB = profileVector(B);
  /* weighted-average affinity across the two accord profiles; since each vector
     sums to 1, this stays bounded to roughly the affinity table's own -2..2 range */
  let vectorScore = 0;
  Object.entries(vecA).forEach(([c1,w1])=>{
    Object.entries(vecB).forEach(([c2,w2])=>{ vectorScore += w1*w2*affinity(c1,c2); });
  });

  const allA = [...A.topNotes,...A.middleNotes,...A.baseNotes].map(n=>n.toLowerCase());
  const allB = [...B.topNotes,...B.middleNotes,...B.baseNotes].map(n=>n.toLowerCase());
  const sharedNotes = [...new Set(allA.filter(n=>allB.includes(n)))];
  const sharedBonus = Math.min(sharedNotes.length, 3) * 0.35;

  const explicitPartner = A.layeringPartners.includes(b) || B.layeringPartners.includes(a);
  const explicitRestrict = A.layeringRestrictions.includes(b) || B.layeringRestrictions.includes(a);
  const familyBonus = A.olfactoryFamily===B.olfactoryFamily ? 0.3 : 0;

  const total = vectorScore + sharedBonus + familyBonus;

  /* explicit records from the collection are ground truth: they override the computed score */
  let verdict;
  if(explicitRestrict) verdict = 'avoid';
  else if(explicitPartner) verdict = 'good';
  else if(total >= 1.05) verdict = 'good';
  else if(total >= 0.25) verdict = 'okay';
  else verdict = 'avoid';

  /* occasion scoring */
  const MOOD_OCC = {
    Formal: ['Sophisticated','Elegant','Classy','Mysterious'],
    Date: ['Romantic','Seductive','Sexy','Intimate'],
    Casual: ['Relaxed','Happy','Cozy','Comfortable','Uplifting'],
    Office: ['Sophisticated','Classy','Clean'],
    Outdoor: ['Energetic','Uplifting','Fresh'],
    'Night Out': ['Mysterious','Seductive','Bold'],
    Sport: ['Energetic','Fresh'],
  };
  const moods = [...A.mood, ...B.mood];
  const occScores = OCCASIONS_FULL.map(occ=>{
    let s = (A.occasion.includes(occ)?1.2:0) + (B.occasion.includes(occ)?1.2:0);
    (MOOD_OCC[occ]||[]).forEach(m=>{ if(moods.some(x=>x.toLowerCase()===m.toLowerCase())) s += 0.5; });
    return [occ, s];
  }).sort((x,y)=>y[1]-x[1]);
  let bestOccasions = occScores.filter(([,s])=>s>0).slice(0,2).map(([o])=>o);
  if(!bestOccasions.length) bestOccasions = ['Casual'];

  /* wearing order, tuned generous for someone who loves overspraying */
  const wA = weightScore(A), wB = weightScore(B);
  const foundation = wA >= wB ? A : B;
  const topLayer = wA >= wB ? B : A;
  const foundationSprays = foundation.projection==='Strong' ? 3 : 4;
  const topSprays = topLayer.projection==='Strong' ? 3 : 4;

  /* third bottle suggestion. score every eligible fragrance in the whole 88-piece collection
     at once: curated layering-partner records earn a strong bonus (so a real recorded synergy
     still tends to win), but the note-affinity math runs for everyone, and the pick is drawn
     from the strongest handful rather than always the single top scorer. that keeps recorded
     pairings meaningfully favoured while letting fragrances that were never explicitly logged
     as anyone's partner still surface, instead of the same half-dozen "universal blenders"
     winning almost every pairing. the seed comes from the pairing itself, so the same two
     fragrances always land on the same hint, but different pairings spread across the shelf. */
  const pickSeeded = (list, seedKey) => list[hashStr(seedKey) % list.length];
  const combined = {};
  Object.entries(vecA).forEach(([c,w])=>combined[c]=(combined[c]||0)+w/2);
  Object.entries(vecB).forEach(([c,w])=>combined[c]=(combined[c]||0)+w/2);

  const hintCandidates = [];
  DATA.forEach(d=>{
    if(d.label===a || d.label===b) return;
    if(A.layeringRestrictions.includes(d.label) || B.layeringRestrictions.includes(d.label)) return;
    const vc = profileVector(d);
    let s = 0;
    Object.entries(combined).forEach(([c1,w1])=>{ Object.entries(vc).forEach(([c2,w2])=>{ s += w1*w2*affinity(c1,c2); }); });
    const bothPartner = A.layeringPartners.includes(d.label) && B.layeringPartners.includes(d.label);
    const onePartner = !bothPartner && (A.layeringPartners.includes(d.label) || B.layeringPartners.includes(d.label));
    if(bothPartner) s += 2.2;
    else if(onePartner) s += 1;
    hintCandidates.push({ d, s, bothPartner, onePartner });
  });
  hintCandidates.sort((x,y)=>y.s-x.s);
  const hintPool = hintCandidates.slice(0, Math.min(10, hintCandidates.length));

  let hint = null, hintReason = '';
  if(hintPool.length){
    const pick = pickSeeded(hintPool, a+'|'+b+'|hint');
    hint = pick.d;
    if(pick.bothPartner){
      hintReason = `Already recorded as a layering partner for both ${A.name} and ${B.name}.`;
    } else if(pick.onePartner){
      const forWhom = A.layeringPartners.includes(pick.d.label) ? A.name : B.name;
      hintReason = `Recorded as a layering partner for ${forWhom}, and its ${dominantCats(pick.d,1)[0] ? CAT_LABEL[dominantCats(pick.d,1)[0]] : 'profile'} character bridges the blend.`;
    } else {
      hintReason = `Its ${dominantCats(pick.d,1)[0] ? CAT_LABEL[dominantCats(pick.d,1)[0]] : 'profile'} accord sits close to what this pairing is already doing, so it extends the blend rather than fighting it.`;
    }
  }

  return { A, B, verdict, vectorScore, sharedNotes, explicitPartner, explicitRestrict,
    domA: dominantCats(A,2), domB: dominantCats(B,2), bestOccasions,
    foundation, topLayer, foundationSprays, topSprays, hint, hintReason };
}
const OCCASIONS_FULL = ['Formal','Date','Casual','Office','Outdoor','Night Out','Sport'];

function titleCase(s){ return s.replace(/\w\S*/g, t=>t[0].toUpperCase()+t.slice(1)); }

function reasonLine(res){
  const {A,B,verdict,domA,domB,sharedNotes,explicitPartner,explicitRestrict} = res;
  const a0 = CAT_LABEL[domA[0]] || 'layered', b0 = CAT_LABEL[domB[0]] || 'layered';
  let s;
  if(explicitRestrict){
    s = `${A.name} and ${B.name} are flagged as a restriction in the collection notes. The ${a0} side of ${A.name} tends to fight the ${b0} side of ${B.name} rather than blend with it.`;
  } else if(explicitPartner){
    s = `${A.name} and ${B.name} are already recorded as layering partners. The ${a0} character of ${A.name} and the ${b0} character of ${B.name} sit naturally together.`;
  } else if(verdict==='good'){
    s = `${A.name}'s ${a0} accord and ${B.name}'s ${b0} accord are a classic combination. They build on each other instead of competing for attention.`;
  } else if(verdict==='okay'){
    s = `${A.name}'s ${a0} accord and ${B.name}'s ${b0} accord don't clash, but there isn't much chemistry either. More coexistence than blend.`;
  } else {
    s = `${A.name}'s ${a0} accord and ${B.name}'s ${b0} accord pull in different directions. Worn together they're more likely to read as muddled than intentional.`;
  }
  if(sharedNotes.length){ s += ` Both carry ${sharedNotes.slice(0,2).map(titleCase).join(' and ')}, which helps tie them together.`; }
  return s;
}

function renderAnalysis(res){
  if(!res) return '';
  const verdictMeta = {
    good: {label:'Good pairing', cls:'partner', icon:ICONS.check},
    okay: {label:'Just okay', cls:'neutral', icon:ICONS.chevron},
    avoid:{label:'Avoid this pairing', cls:'restrict', icon:ICONS.x},
  }[res.verdict];

  if(res.verdict === 'avoid'){
    return `
    <div class="analysis pop-in">
      <div class="analysis-verdict ${verdictMeta.cls}">
        <span class="av-icon">${verdictMeta.icon}</span>
        <div>
          <div class="av-label">${esc(verdictMeta.label)}</div>
          <p class="av-reason">${esc(reasonLine(res))}</p>
        </div>
      </div>
      <div class="analysis-grid">
        <div class="ai-block">
          <div class="eyebrow">${esc(res.A.name)} wears best for</div>
          <div class="ai-pills">${(res.A.occasion.length?res.A.occasion:['Casual']).slice(0,3).map(o=>`<span class="tag">${esc(o)}</span>`).join('')}</div>
        </div>
        <div class="ai-block">
          <div class="eyebrow">${esc(res.B.name)} wears best for</div>
          <div class="ai-pills">${(res.B.occasion.length?res.B.occasion:['Casual']).slice(0,3).map(o=>`<span class="tag">${esc(o)}</span>`).join('')}</div>
        </div>
        <div class="ai-block">
          <div class="eyebrow">Instead</div>
          <p>Keep these on separate days. ${res.hint ? `If you want to layer either of them, <strong>${esc(res.hint.brand)} ${esc(res.hint.name)}</strong> is a safer match, its profile does not fight either one.` : 'Reach for one at a time until a better match turns up.'}</p>
        </div>
      </div>
    </div>`;
  }

  return `
  <div class="analysis pop-in">
    <div class="analysis-verdict ${verdictMeta.cls}">
      <span class="av-icon">${verdictMeta.icon}</span>
      <div>
        <div class="av-label">${esc(verdictMeta.label)}</div>
        <p class="av-reason">${esc(reasonLine(res))}</p>
      </div>
    </div>
    <div class="analysis-grid">
      <div class="ai-block">
        <div class="eyebrow">Best worn for</div>
        <div class="ai-pills">${res.bestOccasions.map(o=>`<span class="tag">${esc(o)}</span>`).join('')}</div>
      </div>
      <div class="ai-block">
        <div class="eyebrow">How to layer it</div>
        <p>Spray ${res.foundationSprays} generous sprays of <strong>${esc(res.foundation.name)}</strong> across your chest and forearms first. It's the heavier of the two, so it needs to settle in as the base. Wait two or three minutes, then layer ${res.topSprays} sprays of <strong>${esc(res.topLayer.name)}</strong> on your neck and wrists so its opening notes sit on top of the blend rather than under it.</p>
      </div>
      ${res.hint ? `<div class="ai-block">
        <div class="eyebrow">Round it out</div>
        <p>Add <strong>${esc(res.hint.brand)} ${esc(res.hint.name)}</strong> to the mix. ${esc(res.hintReason)}</p>
      </div>` : ''}
    </div>
  </div>`;
}

/* ============ TODAY'S LAYERING ENGINE ============ */
const WEATHER_CACHE_KEY = 'scentledger_weather_v1';
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function loadWeatherCache(){
  try{
    const raw = localStorage.getItem(WEATHER_CACHE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(obj.day !== todayKey()) return null;
    return obj;
  }catch(e){ return null; }
}
function saveWeatherCache(obj){
  try{ localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(Object.assign({}, obj, {day: todayKey()}))); }catch(e){}
}

/* WMO weather codes -> plain label + broad condition bucket */
const WEATHER_CODES = {
  0:['Clear sky','clear'], 1:['Mostly clear','clear'], 2:['Partly cloudy','cloudy'], 3:['Overcast','cloudy'],
  45:['Foggy','foggy'], 48:['Foggy','foggy'],
  51:['Light drizzle','rainy'], 53:['Drizzle','rainy'], 55:['Dense drizzle','rainy'],
  56:['Freezing drizzle','rainy'], 57:['Freezing drizzle','rainy'],
  61:['Light rain','rainy'], 63:['Rain','rainy'], 65:['Heavy rain','rainy'],
  66:['Freezing rain','rainy'], 67:['Freezing rain','rainy'],
  71:['Light snow','snowy'], 73:['Snow','snowy'], 75:['Heavy snow','snowy'], 77:['Snow grains','snowy'],
  80:['Rain showers','rainy'], 81:['Rain showers','rainy'], 82:['Violent showers','rainy'],
  85:['Snow showers','snowy'], 86:['Snow showers','snowy'],
  95:['Thunderstorm','stormy'], 96:['Thunderstorm, hail','stormy'], 99:['Thunderstorm, hail','stormy'],
};
function weatherCodeInfo(code){ return WEATHER_CODES[code] || ['Unsettled weather','cloudy']; }

function fetchWeather(){
  return new Promise((resolve)=>{
    const cached = loadWeatherCache();
    if(cached){ resolve(cached); return; }
    if(!('geolocation' in navigator) || !window.fetch){ resolve(null); return; }
    let done = false;
    const finish = (val)=>{ if(done) return; done = true; resolve(val); };
    const timer = setTimeout(()=>finish(null), 6500);
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        const {latitude, longitude} = pos.coords;
        const url = 'https://api.open-meteo.com/v1/forecast?latitude='+latitude+'&longitude='+longitude+'&current=temperature_2m,weather_code&timezone=auto';
        fetch(url).then(r=>{ if(!r.ok) throw new Error('bad response'); return r.json(); })
          .then(j=>{
            clearTimeout(timer);
            const result = { temp: j.current.temperature_2m, code: j.current.weather_code, source:'live' };
            saveWeatherCache(result);
            finish(result);
          })
          .catch(()=>{ clearTimeout(timer); finish(null); });
      },
      ()=>{ clearTimeout(timer); finish(null); },
      { timeout: 6000, maximumAge: 3600000 }
    );
  });
}

/* map live temperature + condition (or, lacking that, just the calendar) onto the
   collection's existing season/accord vocabulary so scoring can reuse profileVector */
function climateBucket(temp, cond){
  if(cond==='rainy' || cond==='stormy') return { season:'Fall', prefer:['woody','amber','spicy','gourmand','musk'] };
  if(cond==='snowy') return { season:'Winter', prefer:['amber','woody','musk','spicy'] };
  if(temp==null){
    const m = new Date().getMonth();
    if(m===11||m===0||m===1) return { season:'Winter', prefer:['amber','woody','musk','spicy'] };
    if(m>=2&&m<=4) return { season:'Spring', prefer:['floral','citrus','green','fruity'] };
    if(m>=5&&m<=7) return { season:'Summer', prefer:['citrus','aquatic','green','fruity'] };
    return { season:'Fall', prefer:['woody','spicy','amber'] };
  }
  if(temp>=29) return { season:'Summer', prefer:['citrus','aquatic','green','fruity'] };
  if(temp>=23) return { season:'Spring', prefer:['floral','citrus','green','fruity'] };
  if(temp>=17) return { season:'Fall', prefer:['woody','spicy','amber'] };
  return { season:'Winter', prefer:['amber','woody','musk','spicy'] };
}

function dayTypeAndTime(){
  const now = new Date();
  const day = now.getDay();
  const hour = now.getHours();
  const isWeekend = (day===0 || day===6);
  let timeOfDay;
  if(hour<11) timeOfDay='Morning';
  else if(hour<15) timeOfDay='Afternoon';
  else if(hour<19) timeOfDay='Evening';
  else timeOfDay='Night';
  return { isWeekend, timeOfDay, dayName: now.toLocaleDateString(undefined,{weekday:'long'}) };
}

function fragranceClimateFit(d, bucket, ctx){
  const vec = profileVector(d);
  let score = 0;
  bucket.prefer.forEach((cat,i)=>{ score += (vec[cat]||0) * (bucket.prefer.length - i); });
  if(d.season && d.season.includes(bucket.season)) score += 1.5;
  const wantedOcc = ctx.isWeekend ? ['Casual','Date','Outdoor'] : ['Office','Casual'];
  wantedOcc.forEach(o=>{ if(d.occasion.includes(o)) score += 0.8; });
  if(d.timeOfDay && d.timeOfDay.includes(ctx.timeOfDay)) score += 0.8;
  return score;
}

function computeTodaysLayering(weather){
  const cond = weather ? weatherCodeInfo(weather.code)[1] : null;
  const temp = weather ? weather.temp : null;
  const bucket = climateBucket(temp, cond);
  const ctx = dayTypeAndTime();

  const scored = DATA.map(d=>({ d, score: fragranceClimateFit(d, bucket, ctx) })).sort((x,y)=>y.score-x.score);
  let pool = scored.slice(0, Math.min(12, scored.length)).map(x=>x.d);
  if(pool.length < 2) pool = DATA.slice(0, Math.min(12, DATA.length));

  const scoreOf = (label)=>{ const f = scored.find(s=>s.d.label===label); return f ? f.score : 0; };
  let candidates = [];
  for(let i=0;i<pool.length;i++){
    for(let j=i+1;j<pool.length;j++){
      const A = pool[i], B = pool[j];
      if(A.label===B.label) continue;
      const res = analyzePairing(A.label, B.label);
      if(res && res.verdict !== 'avoid'){
        const fitScore = scoreOf(A.label) + scoreOf(B.label) + (res.verdict==='good' ? 2 : 0);
        candidates.push({ res, fitScore });
      }
    }
  }
  if(!candidates.length){
    /* relax entirely and just find any non-avoid pair in the collection */
    outer:
    for(let i=0;i<DATA.length;i++){
      for(let j=i+1;j<DATA.length;j++){
        const res = analyzePairing(DATA[i].label, DATA[j].label);
        if(res && res.verdict !== 'avoid'){ candidates.push({ res, fitScore: 0 }); break outer; }
      }
    }
  }
  if(!candidates.length) return null;

  candidates.sort((x,y)=>y.fitScore-x.fitScore);
  const top = candidates.slice(0, Math.min(5, candidates.length));
  const seed = hashStr(todayKey() + '|todayslayering');
  const pick = top[seed % top.length];
  return { res: pick.res, bucket, ctx, weather, cond };
}

let TODAYS_LAYERING_CACHE = null;

  const el = document.getElementById('todaysLayering');

    el.innerHTML = todaysLayeringHTML(TODAYS_LAYERING_CACHE.value);

/* ============ MOTION ENGINE ============ */
const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let io = null;

function easeOutExpo(t){ return t===1 ? 1 : 1 - Math.pow(2, -10*t); }
function runCountUp(el){
  const target = Number(el.getAttribute('data-countup'));
  if(REDUCE_MOTION || !isFinite(target)){ el.textContent = target; return; }
  const dur = 900, start = performance.now();
  function tick(now){
    const p = Math.min(1, (now-start)/dur);
    el.textContent = Math.round(target * easeOutExpo(p));
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function initObservers(root){
  if(io) io.disconnect();
  if(REDUCE_MOTION){
    root.querySelectorAll('.reveal-io').forEach(el=>el.classList.add('in-view'));
    root.querySelectorAll('.bar-fill').forEach(el=>el.classList.add('in-view'));
    root.querySelectorAll('[data-countup]').forEach(el=>{ el.textContent = el.getAttribute('data-countup'); });
    return;
  }
  io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting) return;
      const el = entry.target;
      if(el.classList.contains('reveal-io')) el.classList.add('in-view');
      if(el.classList.contains('bar-fill')) el.classList.add('in-view');
      if(el.hasAttribute('data-countup')) runCountUp(el);
      io.unobserve(el);
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
  root.querySelectorAll('.reveal-io, .bar-fill, [data-countup]').forEach(el=>io.observe(el));
}

/* tilt + spotlight, delegated so it survives re-renders without rebinding */
if(!REDUCE_MOTION){
  document.addEventListener('pointermove', (e)=>{
    const el = e.target.closest && e.target.closest('[data-tilt]');
    if(!el) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    el.style.setProperty('--mx', (px*100).toFixed(1) + '%');
    el.style.setProperty('--my', (py*100).toFixed(1) + '%');
    el.style.setProperty('--ry', ((px-0.5) * 6).toFixed(2) + 'deg');
    el.style.setProperty('--rx', ((0.5-py) * 6).toFixed(2) + 'deg');
  }, { passive:true });
  document.addEventListener('pointerleave', (e)=>{
    const el = e.target.closest && e.target.closest('[data-tilt]');
    if(!el) return;
    el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg');
  }, true);

  /* magnetic buttons */
  document.addEventListener('pointermove', (e)=>{
    const el = e.target.closest && e.target.closest('[data-magnetic]');
    if(!el) return;
    const r = el.getBoundingClientRect();
    const mx = (e.clientX - (r.left+r.width/2)) * 0.28;
    const my = (e.clientY - (r.top+r.height/2)) * 0.28;
    el.style.transform = `translate(${mx.toFixed(1)}px, ${my.toFixed(1)}px)`;
  }, { passive:true });
  document.addEventListener('pointerleave', (e)=>{
    const el = e.target.closest && e.target.closest('[data-magnetic]');
    if(!el) return;
    el.style.transform = '';
  }, true);
}


function bindMain(){
  const main = document.getElementById('main');
  initObservers(main);

  main.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', e=>{ e.preventDefault(); openDrawer(el.getAttribute('data-open')); });
  });

  const s = document.getElementById('searchInput');
  if(s){ s.addEventListener('input', ()=>{ state.search = s.value; softRerenderCatalogue(); }); }

  const map = {fBrand:'brand', fFamily:'family', fSeason:'season', fOccasion:'occasion', fMood:'mood'};
  Object.entries(map).forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(el){ el.addEventListener('change', ()=>{ state.filters[key]=el.value; render(); }); }
  });
  main.querySelectorAll('[data-clear]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.filters[el.getAttribute('data-clear')]=''; render(); });
  });

  main.querySelectorAll('[data-dim]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.explore.dim = el.getAttribute('data-dim'); state.explore.tag=null; render(); });
  });
  main.querySelectorAll('[data-tag]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t = el.getAttribute('data-tag');
      state.explore.tag = (state.explore.tag===t) ? null : t;
      render();
    });
  });

  const calcA = document.getElementById('calcA'), calcB = document.getElementById('calcB');
  if(calcA && calcB){
    const runCalc = ()=>{
      const res = document.getElementById('calcResult');
      if(!calcA.value || !calcB.value){ res.innerHTML=''; return; }
      if(calcA.value === calcB.value){ res.innerHTML = `<div class="calc-result pop-in neutral">${ICONS.x}<span>Pick two different fragrances to analyse a pairing.</span></div>`; return; }
      const analysis = analyzePairing(calcA.value, calcB.value);
      res.innerHTML = renderAnalysis(analysis);
    };
    calcA.addEventListener('change', runCalc);
    calcB.addEventListener('change', runCalc);
    if(calcA.value && calcB.value && calcA.value !== calcB.value){ runCalc(); }
  }

  if(document.getElementById('todaysLayering')){ loadTodaysLayering(); }

  /* admin: unlock */
  const pwField = document.getElementById('adminPassword');
  const unlockBtn = document.getElementById('adminUnlockBtn');
  if(unlockBtn && pwField){
    const tryUnlock = ()=>{
      if(pwField.value === ADMIN_PASSWORD){
        unlocked = true;
        try{ sessionStorage.setItem(UNLOCK_KEY,'1'); }catch(e){}
        render();
      } else {
        const err = document.getElementById('adminError');
        if(err) err.hidden = false;
        pwField.value = '';
        pwField.focus();
      }
    };
    unlockBtn.addEventListener('click', tryUnlock);
    pwField.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  }

  /* admin: lock / refresh */
  const lockBtn = document.getElementById('adminLockBtn');
  if(lockBtn){ lockBtn.addEventListener('click', ()=>{ unlocked=false; try{ sessionStorage.removeItem(UNLOCK_KEY); }catch(e){} render(); }); }
  const refreshBtn = document.getElementById('adminRefreshBtn');
  if(refreshBtn){ refreshBtn.addEventListener('click', ()=>{
    dbStatus = 'loading'; adminRemoveConfirmId=null; render(); syncFromSupabase();
  }); }

  /* admin: add fragrance */
  const addForm = document.getElementById('addForm');
  if(addForm){
    addForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const errEl = document.getElementById('addFormError');
      errEl.hidden = true;
      const fd = new FormData(addForm);
      const fields = {
        name: fd.get('name')||'', brand: fd.get('brand')||'', olfactoryFamily: fd.get('olfactoryFamily')||'',
        topNotes: fd.get('topNotes')||'', middleNotes: fd.get('middleNotes')||'', baseNotes: fd.get('baseNotes')||'',
        mood: fd.get('mood')||'', personalNotes: fd.get('personalNotes')||'',
        projection: fd.get('projection')||'Moderate', longevity: fd.get('longevity')||'6-8h',
        season: fd.getAll('season'), timeOfDay: fd.getAll('timeOfDay'), occasion: fd.getAll('occasion'),
      };
      if(!fields.name.trim() || !fields.brand.trim() || !fields.olfactoryFamily.trim() || !fields.topNotes.trim()){
        errEl.hidden = false; errEl.textContent = 'Name, brand, family and at least one top note are required.';
        return;
      }
      const submitBtn = addForm.querySelector('button[type="submit"]');
      const originalLabel = submitBtn.textContent;
      submitBtn.disabled = true; submitBtn.textContent = 'Saving…';
      try{
        const item = await addFragrance(fields);
        window.__adminFlash = `Added ${item.brand} - ${item.name} to the collection.`;
        render();
      }catch(err){
        console.warn('addFragrance failed', err);
        errEl.hidden = false; errEl.textContent = 'Could not save to the database. Check your connection and try again.';
        submitBtn.disabled = false; submitBtn.textContent = originalLabel;
      }
    });
  }

  /* admin: remove list + search */
  const adminSearch = document.getElementById('adminSearch');
  if(adminSearch){
    adminSearch.addEventListener('input', ()=>{
      document.getElementById('adminList').innerHTML = renderAdminList(adminSearch.value);
      bindAdminList();
    });
  }
  bindAdminList();
}

function bindAdminList(){
  const list = document.getElementById('adminList');
  if(!list) return;
  list.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = Number(btn.getAttribute('data-remove'));
      if(adminRemoveConfirmId === id){
        btn.disabled = true; btn.textContent = 'Removing…';
        try{
          await removeFragrance(id);
          adminRemoveConfirmId = null;
          const search = document.getElementById('adminSearch');
          list.innerHTML = renderAdminList(search ? search.value : '');
          const statusEl = document.querySelector('.admin-status');
          if(statusEl) statusEl.textContent = `Synced with database · ${DATA.length} fragrances`;
          bindAdminList();
        }catch(err){
          console.warn('removeFragrance failed', err);
          btn.disabled = false; btn.textContent = 'Confirm remove';
          const statusEl = document.querySelector('.admin-status');
          if(statusEl) statusEl.textContent = 'Could not remove — check your connection and try again.';
        }
      } else {
        adminRemoveConfirmId = id;
        const search = document.getElementById('adminSearch');
        list.innerHTML = renderAdminList(search ? search.value : '');
        bindAdminList();
      }
    });
  });
}

function softRerenderCatalogue(){
  const results = DATA.filter(matchesFilters);
  document.querySelector('.result-count').textContent = results.length + ' of ' + DATA.length;
  const gridWrap = document.querySelector('.wrap:has(.grid), .wrap:has(.empty)');
  if(gridWrap){
    gridWrap.innerHTML = results.length ? `<div class="grid">${results.map((d,i)=>card(d,i)).join('')}</div>` : emptyState('No fragrance matches these filters. Try clearing one.');
    bindMain();
  }
}
